name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'imgs/'
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 11 * * *'
  watch:
    types: started

jobs:
  build:
    name: glados checkin
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]

    steps:
    - uses: actions/checkout@v4

    - name: set up python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install pypushdeer

    # 执行 签到脚本
    - name: running checkin
      run: |
        python checkin.py
      env:
        # env获取
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_MESSAGE_THREAD_ID: ${{ secrets.TG_MESSAGE_THREAD_ID }}
        GLADOS_ACCOUNT_NAMES: ${{ secrets.GLADOS_ACCOUNT_NAMES }}
        GLADOS_ACCOUNT_SITES: ${{ secrets.GLADOS_ACCOUNT_SITES }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        # 按站点分账号 Cookie：同站多号用序号 1..5，不带序号等价于序号 1
        # 新增第 6 个账号时，需要在本文件补一行
        GLADOS_COOKIE_RAILGUN: ${{ secrets.GLADOS_COOKIE_RAILGUN }}
        GLADOS_COOKIE_RAILGUN1: ${{ secrets.GLADOS_COOKIE_RAILGUN1 }}
        GLADOS_COOKIE_RAILGUN2: ${{ secrets.GLADOS_COOKIE_RAILGUN2 }}
        GLADOS_COOKIE_RAILGUN3: ${{ secrets.GLADOS_COOKIE_RAILGUN3 }}
        GLADOS_COOKIE_RAILGUN4: ${{ secrets.GLADOS_COOKIE_RAILGUN4 }}
        GLADOS_COOKIE_RAILGUN5: ${{ secrets.GLADOS_COOKIE_RAILGUN5 }}
        GLADOS_COOKIE_GLADOS: ${{ secrets.GLADOS_COOKIE_GLADOS }}
        GLADOS_COOKIE_GLADOS1: ${{ secrets.GLADOS_COOKIE_GLADOS1 }}
        GLADOS_COOKIE_GLADOS2: ${{ secrets.GLADOS_COOKIE_GLADOS2 }}
        GLADOS_COOKIE_GLADOS3: ${{ secrets.GLADOS_COOKIE_GLADOS3 }}
        GLADOS_COOKIE_GLADOS4: ${{ secrets.GLADOS_COOKIE_GLADOS4 }}
        GLADOS_COOKIE_GLADOS5: ${{ secrets.GLADOS_COOKIE_GLADOS5 }}
        GLADOS_NAME_RAILGUN: ${{ secrets.GLADOS_NAME_RAILGUN }}
        GLADOS_NAME_RAILGUN1: ${{ secrets.GLADOS_NAME_RAILGUN1 }}
        GLADOS_NAME_RAILGUN2: ${{ secrets.GLADOS_NAME_RAILGUN2 }}
        GLADOS_NAME_RAILGUN3: ${{ secrets.GLADOS_NAME_RAILGUN3 }}
        GLADOS_NAME_RAILGUN4: ${{ secrets.GLADOS_NAME_RAILGUN4 }}
        GLADOS_NAME_RAILGUN5: ${{ secrets.GLADOS_NAME_RAILGUN5 }}
        GLADOS_NAME_GLADOS: ${{ secrets.GLADOS_NAME_GLADOS }}
        GLADOS_NAME_GLADOS1: ${{ secrets.GLADOS_NAME_GLADOS1 }}
        GLADOS_NAME_GLADOS2: ${{ secrets.GLADOS_NAME_GLADOS2 }}
        GLADOS_NAME_GLADOS3: ${{ secrets.GLADOS_NAME_GLADOS3 }}
        GLADOS_NAME_GLADOS4: ${{ secrets.GLADOS_NAME_GLADOS4 }}
        GLADOS_NAME_GLADOS5: ${{ secrets.GLADOS_NAME_GLADOS5 }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}

    - name: keep alive
      uses: liskin/gh-workflow-keepalive@v1 # using the workflow with default settings
      
    - name: delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 10
        delete_run_by_conclusion_pattern: success
 
